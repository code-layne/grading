[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grading"
version = "0.1.0"
description = "Scan-to-score grading for the packet-based math courses"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "zxing-cpp>=2.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "anthropic>=2.1,<3",
    "sympy>=1.13",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
grading = "grading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
