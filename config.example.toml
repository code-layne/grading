# Copy to ~/.config/grading/config.toml (or point $GRADING_CONFIG at it).
# The inbox, the data folder and roster-map.csv must be outside every git
# work tree: grading refuses to start otherwise.

[paths]
# Curriculum checkouts. Ingest finds each assignment's manifest.json in their
# build output (target/<unit>/<lesson>/grading/<component>/manifest.json).
curricula = ["~/Mathematics/algebra_2"]
# Copier scan-to-PDF lands here. Ingested PDFs move to <inbox>/ingested/.
inbox = "~/Grading/inbox"
# The database (grading.sqlite), strip-blanked page images and crops.
data = "~/Grading/data"
# Names <-> tracking ids. Only the report step reads it; ingest never does.
roster = "~/Rosters/algebra2/roster-map.csv"

[ingest]
dpi = 300
# Gray level (0-255) below which a pixel is ink. Show-through measured 203 at
# its darkest on the Brother test scan; printed ink about 30.
ink_threshold = 160
# Ink components smaller than this (pixels) are specks, ignored by the blank check.
speck_px = 40
# A box with less ink than this (pixels, after specks) is marked blank.
blank_ink_px = 80
crop_margin_pt = 6.0
max_mark_residual_px = 6.0

[api]
# Model ids from platform.claude.com/docs/en/about-claude/models/overview.
# One model transcribes; the other scores rubric items and runs the verify pass.
read_model = "claude-opus-5-5"
judge_model = "claude-opus-5-5"
# output_config.effort: low, medium, high, xhigh or max. Opus 5.5 always
# thinks; effort sets how much (and how many output tokens a call bills).
read_effort = "low"
judge_effort = "medium"
read_max_tokens = 4096
judge_max_tokens = 8192
# A run over more crops than this goes through the Batch API (half price, but
# promised only within 24 hours). Smaller runs use the standard API. --now and
# --batch override this for one run.
batch_threshold = 20
batch_poll_seconds = 30
# A live run estimated above this many dollars is refused outright.
max_run_usd = 10.0
# Standard calls only: a request the safety classifier declines is retried
# server-side on a fallback model (beta server-side-fallback-2026-07-01).
refusal_fallback = true
# The Keychain item holding the API key (else $ANTHROPIC_API_KEY).
keychain_service = "anthropic-grading"
max_retries = 4
# Output tokens per call that the cost estimate assumes (thinking included).
# Tune them from the token report of `grading eval`.
est_read_output_tokens = 800
est_rubric_output_tokens = 2500
est_verify_output_tokens = 1200

# Dollars per million tokens, from platform.claude.com/docs/en/about-claude/pricing
# (read 2026-10-22). The Batch API takes 50% off every line. These are built
# in; a [prices."model"] table here replaces one, or adds a model.
[prices."claude-opus-5-5"]
input = 4.00
output = 20.00
cache_write_5m = 5.00
cache_write_1h = 8.00
cache_read = 0.20

[prices."claude-sonnet-5-5"]
input = 2.00
output = 10.00
cache_write_5m = 2.50
cache_write_1h = 4.00
cache_read = 0.10
